<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1080" width="1000" height="1080" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Studyflow architecture</title>
  <desc id="d">A student's browser talks to a Cloudflare Pages proxy, which reaches a private Worker over a service binding. The Worker routes each anonymous student to their own StudyAgent Durable Object, a VoiceInputAgent, and a StudyPlanWorkflow. These call Llama 3.3 and Deepgram Nova-3 on Workers AI.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d9670b"/>
    </marker>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6821f"/>
      <stop offset="1" stop-color="#fbad41"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #fbfaf8; stroke: #e7e5e4; }
    .h1 { font-size: 26px; font-weight: 700; fill: #1c1917; }
    .sub { font-size: 13.5px; fill: #57534e; }
    .zone { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; fill: #57534e; }
    .title { font-size: 14px; font-weight: 700; fill: #1e293b; }
    .txt { font-size: 12px; fill: #334155; }
    .small { font-size: 11px; fill: #475569; }
    .lbl { font-size: 11.5px; font-weight: 600; fill: #44403c; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .flow { stroke: #334155; stroke-width: 2; fill: none; }
    .flow-o { stroke: #d9670b; stroke-width: 2.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="999" height="1079" rx="18"/>
  <rect x="0" y="0" width="1000" height="6" rx="3" fill="url(#head)"/>

  <text class="h1" x="40" y="46">Studyflow architecture</text>
  <text class="sub" x="40" y="68">One anonymous student = one Durable Object. Everything runs on Cloudflare.</text>

  <!-- 1 BROWSER -->
  <rect x="40" y="88" width="920" height="122" rx="14" fill="#f1f5f9" stroke="#94a3b8" filter="url(#shadow)"/>
  <circle cx="62" cy="109" r="10" fill="#475569"/><text class="num" x="62" y="113" text-anchor="middle">1</text>
  <text class="zone" x="80" y="113">STUDENT'S BROWSER · React 19 · Vite · Tailwind · signed sf_session cookie</text>
  <g class="txt" text-anchor="middle">
    <rect x="60"  y="130" width="164" height="60" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text class="title" x="142" y="156">Chat</text><text class="small" x="142" y="174">streaming · tool cards</text>
    <rect x="239" y="130" width="164" height="60" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text class="title" x="321" y="156">Today</text><text class="small" x="321" y="174">reminders · check-in</text>
    <rect x="418" y="130" width="164" height="60" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text class="title" x="500" y="156">Study plans</text><text class="small" x="500" y="174">review · Mermaid Gantt</text>
    <rect x="597" y="130" width="164" height="60" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text class="title" x="679" y="156">Memory</text><text class="small" x="679" y="174">goals · weak topics</text>
    <rect x="776" y="130" width="164" height="60" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text class="title" x="858" y="156">Voice</text><text class="small" x="858" y="174">push-to-talk dictation</text>
  </g>

  <!-- arrow 1 -->
  <line class="flow" x1="500" y1="212" x2="500" y2="262" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="514" y="242">WebSocket + HTTPS · same origin</text>

  <!-- 2 PAGES -->
  <rect x="40" y="264" width="920" height="108" rx="14" fill="#fff7ed" stroke="#f6821f" filter="url(#shadow)"/>
  <circle cx="62" cy="285" r="10" fill="#f6821f"/><text class="num" x="62" y="289" text-anchor="middle">2</text>
  <text class="zone" x="80" y="289">CLOUDFLARE PAGES · the only public URL</text>
  <rect x="60"  y="302" width="280" height="56" rx="10" fill="#fff" stroke="#fdba74"/>
  <text class="title" x="76" y="326">Static assets</text><text class="small" x="76" y="344">the SPA, with a strict CSP in _headers</text>
  <rect x="360" y="302" width="580" height="56" rx="10" fill="#fff" stroke="#fdba74"/>
  <text class="title" x="376" y="326">Pages Function proxy <tspan class="mono small">/agents/*  /api/*</tspan></text>
  <text class="small" x="376" y="344">Same origin, so the cookie stays first-party and there is no CORS</text>

  <!-- arrow 2 -->
  <line class="flow-o" x1="650" y1="374" x2="650" y2="424" marker-end="url(#arrow-o)"/>
  <text class="lbl" x="664" y="403">service binding · the Worker has no public URL</text>

  <!-- 3 WORKER -->
  <rect x="40" y="426" width="920" height="452" rx="14" fill="#fffaf5" stroke="#f6821f" stroke-width="1.5" class="dash" filter="url(#shadow)"/>
  <circle cx="62" cy="447" r="10" fill="#f6821f"/><text class="num" x="62" y="451" text-anchor="middle">3</text>
  <text class="zone" x="80" y="451">WORKER studyflow-api · private</text>

  <rect x="60" y="462" width="880" height="80" rx="10" fill="#fff" stroke="#fdba74"/>
  <text class="title" x="76" y="484">Entry handler</text>
  <g class="txt" text-anchor="middle">
    <rect x="76"  y="496" width="196" height="32" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="174" y="516">Verify signed cookie → userId</text>
    <rect x="288" y="496" width="196" height="32" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="386" y="516">Check Origin header</text>
    <rect x="500" y="496" width="196" height="32" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="598" y="516">Rate limits per IP</text>
    <rect x="712" y="496" width="212" height="32" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text class="mono" x="818" y="516" style="font-size:11.5px">getAgentByName(userId)</text>
  </g>

  <!-- routing arrows -->
  <line class="flow" x1="240" y1="544" x2="240" y2="596" marker-end="url(#arrow)"/>
  <text class="lbl mono" x="252" y="574" style="font-size:11px">/agents/study</text>
  <line class="flow" x1="850" y1="544" x2="850" y2="596" marker-end="url(#arrow)"/>
  <text class="lbl mono" x="750" y="574" style="font-size:11px" text-anchor="end">/agents/voice</text>

  <!-- StudyAgent -->
  <rect x="60" y="598" width="380" height="260" rx="12" fill="#eef4ff" stroke="#2563eb" filter="url(#shadow)"/>
  <rect x="60" y="598" width="380" height="46" rx="12" fill="#2563eb"/>
  <rect x="60" y="630" width="380" height="14" fill="#2563eb"/>
  <text x="76" y="619" style="font-size:15px;font-weight:700;fill:#fff">StudyAgent</text>
  <text x="76" y="636" style="font-size:11px;fill:#dbeafe">AIChatAgent · Durable Object + SQLite</text>
  <g class="txt" text-anchor="middle">
    <rect x="76"  y="660" width="172" height="48" rx="8" fill="#fff" stroke="#bfdbfe"/><text class="title" x="162" y="680" style="font-size:12.5px">Rolling summary</text><text class="small" x="162" y="696">+ newest turns only</text>
    <rect x="256" y="660" width="172" height="48" rx="8" fill="#fff" stroke="#bfdbfe"/><text class="title" x="342" y="680" style="font-size:12.5px">Relevant memory</text><text class="small" x="342" y="696">at most 15 facts per turn</text>
    <rect x="76"  y="718" width="172" height="48" rx="8" fill="#fff" stroke="#bfdbfe"/><text class="title" x="162" y="738" style="font-size:12.5px">Validated tools</text><text class="small" x="162" y="754">routed by intent · zod</text>
    <rect x="256" y="718" width="172" height="48" rx="8" fill="#fff" stroke="#bfdbfe"/><text class="title" x="342" y="738" style="font-size:12.5px">Approvals</text><text class="small" x="342" y="754">cancel · start a plan</text>
    <rect x="76"  y="776" width="172" height="48" rx="8" fill="#fff" stroke="#bfdbfe"/><text class="title" x="162" y="796" style="font-size:12.5px">Reminders · alarms</text><text class="small" x="162" y="812">schedule() · daily check-in</text>
    <rect x="256" y="776" width="172" height="48" rx="8" fill="#fff" stroke="#bfdbfe"/><text class="title" x="342" y="796" style="font-size:12.5px">Daily caps · usage</text><text class="small" x="342" y="812">tokens logged per call</text>
  </g>
  <text class="small" x="250" y="847" text-anchor="middle">State, chat history and memory live in this student's SQLite</text>

  <!-- Workflow -->
  <rect x="480" y="598" width="220" height="260" rx="12" fill="#eef4ff" stroke="#2563eb" filter="url(#shadow)"/>
  <rect x="480" y="598" width="220" height="46" rx="12" fill="#1d4ed8"/>
  <rect x="480" y="630" width="220" height="14" fill="#1d4ed8"/>
  <text x="494" y="619" style="font-size:15px;font-weight:700;fill:#fff">StudyPlanWorkflow</text>
  <text x="494" y="636" style="font-size:11px;fill:#dbeafe">durable steps, retried</text>
  <g class="txt" text-anchor="middle">
    <rect x="496" y="660" width="188" height="34" rx="8" fill="#fff" stroke="#bfdbfe"/><text x="590" y="682"><tspan font-weight="700" fill="#1d4ed8">1</tspan>  Extract topics (1 LLM call)</text>
    <rect x="496" y="708" width="188" height="34" rx="8" fill="#fff" stroke="#bfdbfe"/><text x="590" y="730"><tspan font-weight="700" fill="#1d4ed8">2</tspan>  Allocate sessions (code)</text>
    <rect x="496" y="756" width="188" height="34" rx="8" fill="#fff" stroke="#bfdbfe"/><text x="590" y="778"><tspan font-weight="700" fill="#1d4ed8">3</tspan>  Wait for approval</text>
    <rect x="496" y="804" width="188" height="34" rx="8" fill="#fff" stroke="#bfdbfe"/><text x="590" y="826"><tspan font-weight="700" fill="#1d4ed8">4</tspan>  Schedule the sessions</text>
  </g>
  <g stroke="#2563eb" stroke-width="1.5">
    <line x1="590" y1="695" x2="590" y2="707"/><line x1="590" y1="743" x2="590" y2="755"/><line x1="590" y1="791" x2="590" y2="803"/>
  </g>
  <!-- StudyAgent <-> Workflow -->
  <line class="flow" x1="442" y1="728" x2="478" y2="728" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- VoiceInputAgent -->
  <rect x="740" y="598" width="200" height="260" rx="12" fill="#eef4ff" stroke="#2563eb" filter="url(#shadow)"/>
  <rect x="740" y="598" width="200" height="46" rx="12" fill="#3b82f6"/>
  <rect x="740" y="630" width="200" height="14" fill="#3b82f6"/>
  <text x="754" y="619" style="font-size:15px;font-weight:700;fill:#fff">VoiceInputAgent</text>
  <text x="754" y="636" style="font-size:11px;fill:#dbeafe">push-to-talk dictation</text>
  <g class="txt" text-anchor="middle">
    <rect x="756" y="660" width="168" height="48" rx="8" fill="#fff" stroke="#bfdbfe"/><text class="title" x="840" y="680" style="font-size:12.5px">Mic audio in</text><text class="small" x="840" y="696">closes at 60 s</text>
    <rect x="756" y="718" width="168" height="48" rx="8" fill="#fff" stroke="#bfdbfe"/><text class="title" x="840" y="738" style="font-size:12.5px">Transcript out</text><text class="small" x="840" y="754">fills the chat box</text>
    <rect x="756" y="776" width="168" height="48" rx="8" fill="#fff" stroke="#bfdbfe"/><text class="title" x="840" y="796" style="font-size:12.5px">300 s / day cap</text><text class="small" x="840" y="812">asked of StudyAgent (RPC)</text>
  </g>

  <!-- arrows to Workers AI -->
  <line class="flow" x1="250" y1="860" x2="250" y2="940" marker-end="url(#arrow)"/>
  <text class="lbl" x="262" y="898">chat · tool calls · summary</text>
  <line class="flow" x1="590" y1="860" x2="590" y2="940" marker-end="url(#arrow)"/>
  <text class="lbl" x="602" y="898">topic extraction</text>
  <line class="flow" x1="850" y1="860" x2="850" y2="940" marker-end="url(#arrow)"/>
  <text class="lbl" x="862" y="898">speech-to-text</text>

  <!-- 4 WORKERS AI -->
  <rect x="40" y="916" width="920" height="100" rx="14" fill="#f5f0ff" stroke="#7c3aed" filter="url(#shadow)"/>
  <circle cx="62" cy="935" r="10" fill="#7c3aed"/><text class="num" x="62" y="939" text-anchor="middle">4</text>
  <text class="zone" x="80" y="939">WORKERS AI · env.AI binding</text>
  <rect x="60"  y="950" width="660" height="52" rx="10" fill="#fff" stroke="#c4b5fd"/>
  <text class="title" x="76" y="973" style="font-size:14px">Llama 3.3 70B <tspan class="mono small">@cf/meta/llama-3.3-70b-instruct-fp8-fast</tspan></text>
  <text class="small" x="76" y="991">Streams every reply; calls tools; writes the rolling summary; reads syllabi</text>
  <rect x="740" y="950" width="200" height="52" rx="10" fill="#fff" stroke="#c4b5fd"/>
  <text class="title" x="756" y="973" style="font-size:14px">Deepgram Nova-3</text>
  <text class="small" x="756" y="991">speech-to-text</text>

  <!-- legend -->
  <g class="small" transform="translate(40 1048)">
    <rect x="0" y="-9" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#94a3b8"/><text x="22" y="3">Browser</text>
    <rect x="100" y="-9" width="14" height="14" rx="3" fill="#fff7ed" stroke="#f6821f"/><text x="122" y="3">Cloudflare Pages and Worker</text>
    <rect x="300" y="-9" width="14" height="14" rx="3" fill="#eef4ff" stroke="#2563eb"/><text x="322" y="3">Durable Objects and Workflow</text>
    <rect x="500" y="-9" width="14" height="14" rx="3" fill="#f5f0ff" stroke="#7c3aed"/><text x="522" y="3">Workers AI models</text>
  </g>
</svg>
